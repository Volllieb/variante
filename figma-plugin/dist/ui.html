<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* ── Design Tokens ─────────────────────────────────────────────────────── */
:root {
  /* Panda Light — wie Dashboard, invertiert */
  --bg-0:          #ffffff;
  --bg-1:          #f5f5f5;
  --bg-2:          #ececec;
  --border:        rgba(0,0,0,.08);
  --border-strong: rgba(0,0,0,.12);
  --text:          #171717;
  --text-2:        rgba(23,23,23,.58);
  --text-3:        rgba(23,23,23,.36);
  /* Akzent: Blau (einziger Farbakzent) */
  --accent:        #0D99FF;
  --accent-hover:  #0B87E0;
  --accent-subtle: rgba(13,153,255,.10);
  --accent-border: rgba(13,153,255,.24);
  /* Status-Farben — identisch mit Dashboard */
  --ok:            #2fd76c;
  --ok-subtle:     rgba(47,215,108,.12);
  --ok-border:     rgba(47,215,108,.30);
  --pro:           #f5a623;
  --pro-subtle:    rgba(245,166,35,.13);
  --pro-border:    rgba(245,166,35,.30);
  --err:           #f5455c;
  --err-subtle:    rgba(245,69,92,.09);
  --err-border:    rgba(245,69,92,.25);
  --err-hover:     rgba(245,69,92,.12);
  /* Radii — vereinheitlicht mit Dashboard */
  --r:   10px;
  --rsm: 6px;
  --rxs: 4px;
  /* Spacing, Typo, Motion — unverändert */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-7: 28px; --sp-8: 32px;
  --fs-xs: 10px; --fs-sm: 11px; --fs-md: 12px; --fs-lg: 13px; --fs-xl: 16px; --fs-2xl: 20px;
  --fw-med: 500; --fw-semibold: 600; --fw-bold: 700;
  --dur-fast: 150ms; --dur-med: 250ms; --dur-slow: 400ms;
  --ease-out: cubic-bezier(.16,1,.3,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: var(--fs-md);
  color: var(--text);
  background: var(--bg-0);
  display: flex; flex-direction: column;
  height: 560px; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Screen shell ──────────────────────────────────────────────────────── */
.screen { display: none; flex-direction: column; height: 100%; }
.screen.active { display: flex; }

/* ── Header ────────────────────────────────────────────────────────────── */
.hdr {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 14px 16px 12px;
  flex-shrink: 0;
  background: var(--bg-0);
  border-bottom: 1px solid var(--border);
}
.back-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); background: var(--bg-1);
  cursor: pointer;
  color: var(--text-2);
  border-radius: 6px; flex-shrink: 0; padding: 0;
  transition: background var(--dur-fast), color var(--dur-fast), transform var(--dur-fast);
}
.back-btn:hover { background: var(--bg-0); color: var(--text); transform: translateY(-1px); }
.back-btn svg { display: block; }
.hdr-title { flex: 1; font-size: var(--fs-lg); font-weight: var(--fw-semibold); letter-spacing: -.2px; line-height: 1.3; }
.hdr-step {
  flex-shrink: 0;
  font-size: var(--fs-xs); font-weight: var(--fw-semibold);
  color: var(--text-2);
  background: var(--bg-1);
  padding: 3px 8px; border-radius: 999px;
}

/* ── Progress bar ──────────────────────────────────────────────────────── */
.step-bar {
  display: flex; gap: 4px;
  padding: 10px 16px 0; flex-shrink: 0;
}
.step-dot {
  flex: 1; height: 4px; border-radius: 999px;
  background: var(--border);
  transition: background var(--dur-med) var(--ease-out);
}
.step-dot.on { background: var(--accent); }

/* ── Content / scroll area ─────────────────────────────────────────────── */
.body {
  flex: 1; overflow-y: auto;
  padding: 16px 16px 12px;
}
.body::-webkit-scrollbar { width: 5px; }
.body::-webkit-scrollbar-thumb { background: rgba(15,23,42,.18); border-radius: 999px; }

/* ── Footer ─────────────────────────────────────────────────────────────── */
.ftr {
  padding: 14px 16px 16px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: var(--sp-2);
}

/* ── Typography ─────────────────────────────────────────────────────────── */
.lbl {
  display: block;
  font-size: var(--fs-xs); font-weight: var(--fw-semibold);
  text-transform: uppercase; letter-spacing: .6px;
  color: var(--text-2);
  margin-bottom: 6px;
}
.hint {
  font-size: var(--fs-sm); color: var(--text-2);
  line-height: 1.6; margin-bottom: 16px;
}
.hint-strong {
  font-size: var(--fs-md); font-weight: var(--fw-med);
  color: var(--text); line-height: 1.5;
  margin-bottom: 14px;
  text-align: center;
  padding: 12px 14px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--r);
  
}

/* ── Inputs ─────────────────────────────────────────────────────────────── */
input, select, textarea {
  width: 100%; padding: 10px 12px;
  border: 1px solid transparent; border-radius: var(--r);
  font-size: var(--fs-md); font-family: inherit;
  color: var(--text); background: var(--bg-1);
  outline: none; transition: border-color var(--dur-fast), background var(--dur-fast), transform var(--dur-fast);
}
input:hover, select:hover, textarea:hover { border-color: var(--text-2); }
input:focus, select:focus, textarea:focus {
  border-color: var(--accent); background: var(--bg-0);
}
input.err { border-color: var(--err); }
textarea { resize: vertical; }

.input-wrap { position: relative; margin-bottom: var(--sp-1); }
.input-wrap input { padding-right: 36px; }
.input-icon {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  pointer-events: none; display: none;
}
.input-wrap.has-prefix input { padding-left: 36px; }
.input-icon-left {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  pointer-events: none; display: flex;
  color: var(--text-2);
}

.field-err {
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--err);
  display: none; padding: 7px 10px; margin-top: 4px;
  background: var(--err-subtle);
  border: 1px solid var(--err-border);
  border-radius: var(--rsm);
}
.field-err.vis { display: block; }

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn {
  width: 100%; padding: 10px 14px;
  min-height: 40px;
  border-radius: var(--r);
  font-size: var(--fs-md); font-weight: var(--fw-semibold);
  cursor: pointer; border: none; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background var(--dur-fast), opacity var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  line-height: 1.2;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn-primary { background: var(--accent); color: #fff;  }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-primary:disabled {
  background: var(--bg-1); color: var(--text-3);
  border: 1px solid var(--border); cursor: not-allowed;
}
.btn-secondary {
  background: var(--bg-1);
  border: 1px solid var(--border);
  color: var(--text);
}
.btn-secondary:hover:not(:disabled) { background: var(--bg-2); border-color: var(--text-2); }
.btn-secondary:disabled { opacity: .5; cursor: not-allowed; }
.btn-sm { width: auto; padding: 7px 12px; min-height: 32px; font-size: var(--fs-sm); font-weight: var(--fw-med); }
.btn-ghost {
  background: transparent; border: none; color: var(--text-2);
  font-weight: var(--fw-med); width: auto; min-height: auto; padding: 6px 8px;
}
.btn-ghost:hover { color: var(--text); background: var(--bg-1); }
.btn-icon-left { justify-content: flex-start; }

/* ── Toggle switch (replaces segmented control) ────────────────────────── */
.toggle-row {
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--bg-1);
  border-radius: var(--r); padding: 3px;
}
.toggle-btn {
  flex: 1; padding: 5px 10px; min-height: 26px;
  border: none; background: none; cursor: pointer;
  font-family: inherit; font-size: var(--fs-sm); font-weight: var(--fw-med);
  color: var(--text-2);
  border-radius: calc(var(--r) - 2px);
  transition: background var(--dur-fast), color var(--dur-fast);
}
.toggle-btn:hover { color: var(--text); }
.toggle-btn.on {
  background: var(--bg-0); color: var(--text);
}
.toggle-icon { display: inline-flex; }
.toggle-icon .toggle-btn { flex: 0 0 auto; width: 30px; padding: 5px 0; display: flex; align-items: center; justify-content: center; }

/* ── Cards ──────────────────────────────────────────────────────────────── */
.card {
  background: var(--bg-1);
  border-radius: var(--r); padding: 14px; margin-bottom: 12px;
  border: 1px solid var(--border);
}
.card-lbl {
  font-size: var(--fs-xs); font-weight: var(--fw-bold); text-transform: uppercase;
  letter-spacing: .5px; color: var(--text-2); margin-bottom: 5px;
}
.card-val { font-size: var(--fs-md); font-weight: var(--fw-med); line-height: 1.4; }

/* ── Welcome / hero shell ─────────────────────────────────────────────── */
.welcome-shell {
  display: flex; flex-direction: column; gap: 14px;
  padding: 20px 16px 16px;
  border-radius: var(--r);
  background: var(--bg-1);
  border: 1px solid var(--border);
}
.welcome-hero {
  text-align: center; padding: 4px 6px 2px;
}
.welcome-logo {
  font-size: 22px; font-weight: 700; letter-spacing: -.3px; color: var(--text);
  margin-bottom: 2px;
}
.welcome-sub { font-size: var(--fs-sm); color: var(--text-2); margin-top: 2px; }
.welcome-steps {
  display: flex; flex-direction: column; gap: 8px;
}
.welcome-step {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px;
  border-radius: var(--rsm);
  background: var(--bg-0);
  border: 1px solid var(--border);
}
.welcome-step-num {
  width: 22px; height: 22px; flex-shrink: 0; border-radius: var(--rxs);
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-2); color: var(--text-2);
  font-size: var(--fs-xs); font-weight: var(--fw-bold);
}
.welcome-step-text { font-size: var(--fs-sm); line-height: 1.5; color: var(--text); }
.welcome-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 2px; }

/* ── Notice ──────────────────────────────────────────────────────────────── */
.notice {
  border-radius: var(--r); padding: 12px 14px; margin-bottom: 14px;
  
}
.notice-blue { background: var(--accent-subtle); border: 1px solid var(--accent-border); }
.notice-green { background: var(--ok-subtle); border: 1px solid var(--ok-border); }
.notice-amber { background: var(--pro-subtle); border: 1px solid var(--pro-border); }
.notice-title { font-size: var(--fs-sm); font-weight: var(--fw-semibold); margin-bottom: 4px; }
.notice-blue .notice-title { color: var(--accent); }
.notice-green .notice-title { color: var(--ok); }
.notice-amber .notice-title { color: var(--pro); }
.notice-body { font-size: var(--fs-sm); line-height: 1.5; margin-bottom: 10px; color: var(--text-2); }
.notice-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.notice-icon {
  width: 30px; height: 30px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-2); color: var(--accent); border-radius: var(--rsm);
}
.notice-head .notice-title { margin-bottom: 2px; }
.notice-head .notice-body { margin-bottom: 0; }

/* ── Element chip ────────────────────────────────────────────────────────── */
.el-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 12px;
  background: var(--accent-subtle);
  border: 1px solid var(--accent-border);
  border-radius: var(--r);
  font-size: var(--fs-md); color: var(--accent); font-weight: var(--fw-med);
  max-width: 100%; overflow: hidden;
}
.el-chip-type {
  font-size: var(--fs-xs); font-weight: var(--fw-bold); text-transform: uppercase;
  letter-spacing: .4px; opacity: .75; flex-shrink: 0;
}
.el-chip-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Metric options (radio cards) ───────────────────────────────────────── */
.m-opt {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r); cursor: pointer; margin-bottom: 8px;
  transition: border-color var(--dur-fast), background var(--dur-fast);
}
.m-opt:hover:not(.m-disabled) { border-color: var(--accent); background: var(--accent-subtle); }
.m-opt.m-selected {
  border-color: var(--accent); background: var(--accent-subtle);
}
.m-opt.m-highlight {
  border-color: var(--pro); background: var(--pro-subtle);
}
.m-opt.m-disabled { opacity: .45; cursor: not-allowed; }
.m-radio {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--border);
  margin-top: 1px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: border-color var(--dur-fast);
}
.m-selected .m-radio, .m-highlight .m-radio { border-color: var(--accent); }
.m-selected .m-radio::after, .m-highlight .m-radio::after {
  content: ''; width: 8px; height: 8px;
  border-radius: 50%; background: var(--accent);
}
.m-title { font-size: var(--fs-md); font-weight: var(--fw-semibold); }
.m-desc { font-size: var(--fs-sm); color: var(--text-2); margin-top: 2px; line-height: 1.4; }

/* ── Scope buttons (segmented control) ─────────────────────────────────── */
.scope-options {
  display: flex; gap: 6px; margin-top: 8px;
}
.scope-btn {
  flex: 1;
  padding: 9px 4px;
  border: 1px solid var(--border);
  background: var(--bg-1);
  color: var(--text);
  border-radius: var(--rsm);
  font-size: var(--fs-sm);
  font-weight: var(--fw-med);
  font-family: inherit;
  cursor: pointer;
  text-align: center;
  transition: border-color var(--dur-fast), background var(--dur-fast), transform var(--dur-fast), color var(--dur-fast);
}
.scope-btn:hover { background: var(--bg-0); transform: translateY(-1px); }
.scope-btn.on {
  border-color: var(--accent);
  background: var(--accent-subtle);
  color: var(--accent);
  font-weight: var(--fw-semibold);
}
.scope-desc {
  font-size: var(--fs-xs);
  color: var(--text-2);
  margin-top: 3px;
  text-align: center;
  line-height: 1.3;
}

/* ── Advanced toggle ─────────────────────────────────────────────────────── */
.adv-toggle {
  display: flex; align-items: center; gap: 5px;
  font-size: var(--fs-sm); font-weight: var(--fw-med); color: var(--text-2);
  cursor: pointer; margin-bottom: 10px; user-select: none; margin-top: 6px;
  background: none; border: none; padding: 0;
  font-family: inherit; width: 100%; text-align: left;
  border-radius: var(--rsm); min-height: 24px;
}
.adv-toggle:hover { color: var(--text); }
.adv-toggle .adv-arrow { transition: transform var(--dur-fast) var(--ease-out); }
.adv-toggle.open .adv-arrow { transform: rotate(90deg); }
.adv-section { display: none; padding: 0 2px 4px; }
.adv-section.open { display: block; }
.adv-group { margin-bottom: 14px; }
.adv-group-title { display: flex; align-items: center; gap: 5px; font-size: var(--fs-sm); font-weight: var(--fw-med); margin-bottom: 4px; }
.adv-group-title svg { flex-shrink: 0; color: var(--text-2); }
.adv-group-desc { font-size: var(--fs-sm); color: var(--text-2); margin-bottom: 8px; line-height: 1.4; }

/* ── Segmented control (sig level) ───────────────────────────────────────── */
.segmented-row { display: flex; gap: 2px; background: var(--bg-input); border-radius: 6px; padding: 2px; }
.seg-btn {
  flex: 1; padding: 6px 0; font-size: var(--fs-sm); font-weight: var(--fw-med);
  border: none; background: transparent; color: var(--text-2); border-radius: 4px;
  cursor: pointer; transition: background var(--dur-fast), color var(--dur-fast);
  font-family: inherit; text-align: center;
}
.seg-btn:hover { color: var(--text); }
.seg-btn.sel { background: var(--accent); color: #fff; font-weight: var(--fw-semibold); }

/* Hybrid-Preview: Loading-Schritte */
.pv-step {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; margin-bottom: 6px;
  font-size: var(--fs-sm); color: var(--text-1);
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px;
  transition: opacity var(--dur-fast);
}
.pv-step-mark { flex: 0 0 auto; width: 14px; text-align: center; }

/* ── Loading ─────────────────────────────────────────────────────────────── */
.loading-row {
  display: flex; align-items: center; gap: var(--sp-2);
  font-size: var(--fs-sm); color: var(--text-2); padding: 8px 0;
}
.loading-center { justify-content: center; padding: 24px 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 14px; height: 14px; flex-shrink: 0;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

/* ── Divider ─────────────────────────────────────────────────────────────── */
.divider { height: 1px; background: var(--border); margin: 14px 0; }

/* ── Badges ──────────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center;
  padding: 1px 7px; border-radius: var(--rxs); font-size: var(--fs-xs); font-weight: var(--fw-bold);
  text-transform: uppercase; letter-spacing: .3px; line-height: 1.7;
}
.ba { background: var(--accent-subtle); color: var(--accent); }
.bb { background: var(--ok-subtle); color: var(--ok); }
.bs-draft   { background: var(--bg-1); color: var(--text-2); border: 1px solid var(--border); }
.bs-active  { background: var(--accent-subtle); color: var(--accent); }
.bs-done    { background: var(--ok-subtle); color: var(--ok); }
.bs-paused  { background: var(--pro-subtle); color: var(--pro); }
.bs-issues  { background: var(--err-subtle); color: var(--err); border: 1px solid var(--err-border); }

/* ── Code pre ────────────────────────────────────────────────────────────── */
pre {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--r); padding: 10px 12px;
  font-size: var(--fs-xs); font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  white-space: pre-wrap; word-break: break-all;
  max-height: 140px; overflow-y: auto; margin-bottom: 10px;
  line-height: 1.5;
}
code {
  background: var(--bg-1);
  padding: 1px 5px; border-radius: var(--rxs); font-size: var(--fs-sm);
}

/* ── Upgrade banner ──────────────────────────────────────────────────────── */
.upgrade-banner {
  display: none;
  background: var(--pro-subtle); border: 1px solid var(--pro-border);
  border-radius: var(--r); padding: 13px 14px; margin-bottom: 14px; text-align: center;
}
.ub-title { font-size: var(--fs-lg); font-weight: var(--fw-bold); color: var(--pro); margin-bottom: 5px; }
.ub-sub   { font-size: var(--fs-sm); color: var(--pro); margin-bottom: 12px; line-height: 1.4; }
.btn-upgrade {
  background: var(--pro); color: #fff; padding: 8px 16px;
  border-radius: var(--r); font-size: var(--fs-md); font-weight: var(--fw-semibold);
  cursor: pointer; border: none; transition: background var(--dur-fast);
}
.btn-upgrade:hover { background: #c78a0a; }

/* ── Dashboard: Test-Karte ───────────────────────────────────────────────── */
.test-card {
  position: relative;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 13px 14px; margin-bottom: 10px; cursor: pointer;
  transition: border-color var(--dur-fast), background var(--dur-fast), transform var(--dur-fast);
  display: flex; flex-direction: column; gap: 8px;
}
.test-card::before {
  content: ''; position: absolute; left: 0; top: 5px; bottom: 5px;
  width: 4px; border-radius: 0 999px 999px 0;
  background: var(--border);
  transition: background var(--dur-fast);
}
.test-card.st-active::before { background: var(--accent); }
.test-card.st-done::before   { background: var(--ok); }
.test-card.st-paused::before { background: var(--pro); }
.test-card:hover { border-color: var(--accent-border); background: var(--bg-0); transform: translateY(-1px); }
.test-card.deleting { opacity: .35; pointer-events: none; transform: scale(.98); }

.tc-row1 { display: flex; align-items: center; gap: 8px; }
.tc-name {
  flex: 1; min-width: 0;
  font-weight: var(--fw-semibold); font-size: var(--fs-md); color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3;
}
.tc-domain {
  font-size: var(--fs-xs); color: var(--text-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-top: 1px;
}
.tc-row2 { display: flex; align-items: center; gap: 8px; }
.tc-stats { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; }
.tc-stat { display: flex; align-items: center; gap: 3px; font-size: var(--fs-sm); color: var(--text-2); }
.tc-stat svg { flex-shrink: 0; }
.tc-stat b { font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums; color: var(--text); }
.tc-stat.pos, .tc-stat.pos svg, .tc-stat.pos b { color: var(--ok); }
.tc-stat.neg, .tc-stat.neg svg, .tc-stat.neg b { color: var(--err); }
.tc-stat.win, .tc-stat.win svg, .tc-stat.win b { color: var(--ok); font-weight: var(--fw-bold); }

.tc-actions { display: flex; gap: 2px; flex-shrink: 0; }
.icon-btn {
  width: 28px; height: 28px;
  border: none; border-radius: var(--rsm);
  background: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  transition: background var(--dur-fast), color var(--dur-fast);
}
.icon-btn:hover { background: var(--bg-2); color: var(--text); }
.icon-btn.danger:hover { background: var(--err-hover); color: var(--err); }

/* ── Dashboard: empty state ──────────────────────────────────────────────── */
.dash-empty {
  text-align: center; padding: 54px 18px 16px;
  display: flex; flex-direction: column; align-items: center;
}
.dash-empty-icon {
  width: 48px; height: 48px; border-radius: var(--r);
  background: var(--bg-1); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px; color: var(--text-2);
}
.dash-empty h3 { font-size: var(--fs-lg); font-weight: var(--fw-semibold); margin-bottom: 6px; }
.dash-empty p  { font-size: var(--fs-sm); color: var(--text-2); line-height: 1.6; margin-bottom: 16px; }

/* ── Plan chip ──────────────────────────────────────────────────────────── */
.plan-chip {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-2);
  padding: 4px 16px 0; flex-shrink: 0;
}

/* ── Dashboard: section header ───────────────────────────────────────────── */
.dash-section {
  display: flex; align-items: center; gap: 8px;
  margin: 16px 0 8px; padding: 0 2px;
}
.dash-section:first-of-type { margin-top: 4px; }
.dash-section-icon { display: flex; flex-shrink: 0; color: var(--text-2); }
.dash-section-label {
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-2);
  text-transform: uppercase; letter-spacing: .4px;
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dash-section-count {
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--text-2);
  background: var(--bg-1); border-radius: 8px; padding: 2px 8px;
}

/* ── Previews ────────────────────────────────────────────────────────────── */
.frame      {
  border: 1px solid var(--border); border-radius: var(--r);
  background: #fff; color: #111; overflow: hidden;
}

/* ── Error / ok text ─────────────────────────────────────────────────────── */
.err { color: var(--err); font-size: var(--fs-sm); min-height: 18px; padding: 4px 0; line-height: 1.3; }
.ok  { color: var(--ok); font-size: var(--fs-sm); padding: 4px 0; }


/* ── Link button (used in toast undo) ───────────────────────────────────── */
.link-btn {
  background: none; border: none; padding: 6px 0 0; cursor: pointer;
  font-size: var(--fs-sm); font-weight: var(--fw-med); color: var(--accent); font-family: inherit;
  transition: opacity var(--dur-fast);
}
.link-btn:hover { opacity: .8; }

/* ── Generate: preview note ──────────────────────────────────────────────── */
.preview-note {
  font-size: var(--fs-xs); color: var(--text-3);
  margin: 5px 0 12px; font-style: italic;
}

/* ── Generate: code drawer ───────────────────────────────────────────────── */
.code-drawer summary {
  font-size: var(--fs-sm); font-weight: var(--fw-med); color: var(--text-2);
  cursor: pointer; user-select: none; padding: 4px 0;
}
.code-drawer pre { margin-top: 6px; }

/* ── Refine overlay ──────────────────────────────────────────────────────── */
.overlay {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,.35); flex-direction: column; justify-content: flex-end;
}
.overlay.open { display: flex; }
.overlay-sheet {
  background: var(--bg-0);
  border-radius: var(--r) var(--r) 0 0;
  border-top: 1px solid var(--border);
  padding: 20px 16px 16px; max-height: 70%;
  display: flex; flex-direction: column; gap: 12px;
  animation: slideUp var(--dur-med) var(--ease-spring);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.overlay-sheet textarea { min-height: 80px; }
.overlay-actions { display: flex; gap: var(--sp-2); }

/* ── Toast ───────────────────────────────────────────────────────────────── */
.toast {
  display: none;
  position: fixed; left: 14px; right: 14px; bottom: 14px;
  align-items: center; justify-content: space-between; gap: 10px;
  background: var(--bg-0); border: 1px solid var(--border);
  border-radius: var(--r); 
  padding: 12px 14px; font-size: var(--fs-sm); z-index: 1000;
}
.toast.vis { display: flex; }

/* ── Utilities ───────────────────────────────────────────────────────────── */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
/* Focus ring */
*:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
summary { padding: 4px 0; cursor: pointer; font-family: inherit; }
@keyframes sk-pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.sk {
  background: var(--bg-1);
  border-radius: var(--rsm);
  animation: sk-pulse 1.2s ease-in-out infinite;
}
.sk-card { height: 60px; border-radius: var(--r); margin-bottom: 8px; }
.sk-line { height: 10px; }

/* ── Dots animation ──────────────────────────────────────────────────────── */
.dots { display: flex; gap: 5px; justify-content: center; }
.dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-2);
  animation: dots-bounce 1.2s ease-in-out infinite;
}
.dots span:nth-child(2) { animation-delay: .15s; }
.dots span:nth-child(3) { animation-delay: .3s; }
@keyframes dots-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-5px); opacity: 1; } }

/* ── prefers-reduced-motion ──────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0s !important;
    animation-duration: 0s !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     SCREEN -2 · Welcome (Onboarding Entry)
════════════════════════════════════════════════════════════════════ -->
<!-- ═══════════════════════════════════════════════════════════════
     SCREEN –1 · Connect / Token Wall
════════════════════════════════════════════════════════════════════ -->
<div id="s-connect" class="screen active">
  <div class="body" style="display:flex;flex-direction:column;justify-content:center;padding:20px 16px 16px">
    <div class="welcome-shell">
      <div class="welcome-hero">
        <div class="welcome-logo">variante</div>
        <div class="welcome-sub">Connect your account to continue.</div>
      </div>

      <div id="c-token">
        <label class="lbl" for="connect-token">API Token</label>
        <input id="connect-token" placeholder="Paste token from dashboard" list="dl-token" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')saveToken()"/>
        <datalist id="dl-token"></datalist>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="btn btn-secondary btn-sm" onclick="openDashboardForToken()" style="flex:1">Get from Dashboard</button>
          <button class="btn btn-secondary btn-sm" onclick="openLoginForToken()" style="flex:1">Login to get token</button>
        </div>
        <div style="margin-top:8px">
          <button class="btn btn-primary" onclick="saveToken()">Connect →</button>
        </div>
        <div class="err" id="e-connect" role="alert" style="margin-top:8px"></div>
        <div style="text-align:center;margin-top:14px">
          <button class="btn btn-ghost" onclick="createAccount()" style="font-size:var(--fs-sm)">No account? Sign up free →</button>
        </div>
        <div style="text-align:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
          <button class="btn btn-ghost" onclick="openPlayground()" style="font-size:var(--fs-xs);color:var(--text-2)">
            🏖️ Not sure yet? Try the demo first →
          </button>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════════════
     SCREEN 0 · Dashboard
════════════════════════════════════════════════════════════════════ -->
<div id="s-dashboard" class="screen">
  <div class="hdr" style="padding:14px 16px 12px">
    <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
      <span class="hdr-title" style="font-size:var(--fs-xl);font-weight:var(--fw-bold)">Your tests</span>
      <span class="badge ba" id="dash-count" style="display:none"></span>
    </div>
    <button class="icon-btn" onclick="showDashboard()" title="Refresh" aria-label="Refresh"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="icon-btn" onclick="goToTokenMode()" title="Account" aria-label="Account"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></button>
  </div>

  <div id="plan-chip" class="plan-chip" style="display:none">Free · <span id="plan-limit">1/1</span></div>

  <div class="body" style="padding-top:8px">

    <div id="dash-list"></div>
    <div class="err" id="e-dashboard" role="alert" style="min-height:0;padding:4px 0 0"></div>
  </div>
  <div class="ftr">
    <button class="btn btn-primary" onclick="openDashboardNewTest()">+ New Test</button>
  </div>
</div>
<!-- ═══════════════════════════════════════════════════════════════
     SCRIPT
════════════════════════════════════════════════════════════════════ -->
<script>
const API = 'https://www.getvariante.com'
const state = { plan: 'free' }
let activeTestCount = 0
let API_TOKEN = ''
let pendingDelete = null

function afetch(url, opts) {
  opts = opts || {}
  if (!navigator.onLine) {
    throw new Error('You appear to be offline. Check your internet connection and try again.')
  }
  const headers = {}
  const src = opts.headers || {}
  for (const k in src) headers[k] = src[k]
  if (API_TOKEN) headers['Authorization'] = 'Bearer ' + API_TOKEN
  opts.headers = headers
  return fetch(url, opts)
}

function apiErrorMessage(status, body) {
  if (status === 401) return 'Your session expired. Please reconnect on the Connect tab.'
  if (status === 429) return 'Too many requests. Please wait a moment and try again.'
  if (status >= 500) return 'Server error — something went wrong on our end. Please try again.'
  if (status === 404) return 'Not found. It may have been deleted.'
  return 'Request failed. Please try again.'
}

function $(id) { return document.getElementById(id) }
function escapeHtml(s) {
  return (s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]))
}

function saveInputHistory(key, value) {
  if (!value) return
  const k = 'ab_history_' + key
  let arr = []
  try { arr = JSON.parse(localStorage.getItem(k) || '[]') } catch (_) {}
  arr = [value, ...arr.filter(v => v !== value)].slice(0, 10)
  try { localStorage.setItem(k, JSON.stringify(arr)) } catch (_) {}
}
function loadInputHistory(key) {
  try { return JSON.parse(localStorage.getItem('ab_history_' + key) || '[]') } catch (_) { return [] }
}
function populateDatalist(id, key) {
  const dl = $(id); if (!dl) return
  dl.innerHTML = ''
  loadInputHistory(key).forEach(v => {
    const o = document.createElement('option'); o.value = v; dl.appendChild(o)
  })
}

function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'))
  $('s-' + id).classList.add('active')
  if (id !== 'dashboard' && pendingDelete) commitPendingDelete()
}

function err(id, msg) {
  const el = $('e-' + id); if (!el) return
  el.textContent = msg
  setTimeout(() => { if (el.textContent === msg) el.textContent = '' }, 4000)
}

function createAccount() {
  parent.postMessage({ pluginMessage: { type: 'OPEN_URL', url: 'https://www.getvariante.com/signup?source=figma-plugin' } }, '*')
}

function goToTokenMode() {
  go('connect')
  populateDatalist('dl-token', 'token')
  if (API_TOKEN) $('connect-token').value = API_TOKEN
}
function openDashboardForToken() {
  parent.postMessage({ pluginMessage: { type: 'OPEN_URL', url: 'https://www.getvariante.com/dashboard/health?source=figma-plugin' } }, '*')
}
function openDashboardNewTest() {
  parent.postMessage({ pluginMessage: { type: 'OPEN_URL', url: 'https://www.getvariante.com/dashboard?newTest=1&source=figma-plugin' } }, '*')
}
function openLoginForToken() {
  parent.postMessage({ pluginMessage: { type: 'OPEN_URL', url: 'https://www.getvariante.com/login?source=figma-plugin' } }, '*')
}
function openPlayground() {
  parent.postMessage({ pluginMessage: { type: 'OPEN_URL', url: 'https://www.getvariante.com/playground?source=figma-plugin' } }, '*')
}

async function saveToken() {
  const v = ($('connect-token').value || '').trim()
  if (!v) { err('connect', 'Please paste your token.'); return }
  const btn = document.querySelector('#c-token .btn-primary')
  if (btn) { btn.textContent = 'Checking…'; btn.disabled = true }
  try {
    const res = await fetch(API + '/api/profile', { headers: { Authorization: 'Bearer ' + v } })
    if (!res.ok) throw new Error('Invalid token — please check your dashboard for the correct token.')
    API_TOKEN = v
    saveInputHistory('token', v)
    parent.postMessage({ pluginMessage: { type: 'TOKEN_SAVE', token: v } }, '*')
    if (btn) { btn.textContent = '✓ Connected!' }
    setTimeout(showDashboard, 800)
  } catch (e) {
    if (btn) { btn.textContent = 'Connect →'; btn.disabled = false }
    err('connect', e.message || 'Invalid token')
  }
}

async function showDashboard() {
  if (pendingDelete) commitPendingDelete()
  go('dashboard')
  const list = $('dash-list')
  const countEl = $('dash-count')
  countEl.style.display = 'none'
  list.innerHTML = '<div role="status"><span class="sr-only">Loading tests…</span>' +
    '<div class="sk sk-card" aria-hidden="true" style="height:56px"></div>' +
    '<div class="sk sk-card" aria-hidden="true" style="height:56px"></div>' +
    '<div class="sk sk-card" aria-hidden="true" style="height:56px"></div></div>'
  try {
    const res = await afetch(API + '/api/tests')
    if (!res.ok) { var eb = {}; try { eb = await res.json() } catch (_) {} throw new Error(apiErrorMessage(res.status, eb)) }
    const { tests, plan } = await res.json()
    if (plan) state.plan = plan
    activeTestCount = tests ? tests.filter(t => t.status !== 'done').length : 0
    if (!tests || !tests.length) {
      $('plan-chip').style.display = 'none'
      list.innerHTML =
        '<div class="dash-empty">' +
          '<div class="dash-empty-icon">' +
            '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 2h7"/><path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.58 16.5h12.85"/></svg>' +
          '</div>' +
          '<h3>No tests yet</h3>' +
          '<p>Run your first A/B test to see<br>how a design change performs.</p>' +
          '<button class="btn btn-primary" onclick="openDashboardNewTest()">+ Create your first test</button>' +
        '</div>'
      return
    }
    countEl.textContent = tests.length
    countEl.style.display = 'inline-flex'

    if (state.plan === 'free') {
      $('plan-chip').style.display = 'block'
      $('plan-limit').textContent = activeTestCount + '/1'
    } else {
      $('plan-chip').style.display = 'none'
    }

    const groups = {}
    tests.forEach(t => { const k = t.site_url || '(no URL)'; (groups[k] = groups[k] || []).push(t) })
    list.innerHTML = ''
    Object.keys(groups).forEach((url, i) => {
      const display = url.replace(/^https?:\/\//, '').replace(/\/+$/, '') || url
      const n = groups[url].length
      const h = document.createElement('div')
      h.className = 'dash-section'
      h.title = url
      h.innerHTML =
        '<span class="dash-section-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></span>' +
        '<span class="dash-section-label">' + escapeHtml(display) + '</span>' +
        '<span class="dash-section-count">' + n + '</span>'
      list.appendChild(h)
      groups[url].forEach(t => list.appendChild(renderTestCard(t)))
    })
  } catch (e) {
    list.innerHTML = '<div class="err" role="alert" style="display:flex;align-items:center;gap:5px;padding:8px 0">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>' +
      'Couldn\'t load your tests. <span style="opacity:.75">(' + escapeHtml(e.message) + ')</span></div>' +
      '<button class="btn btn-secondary btn-sm" onclick="showDashboard()" style="margin-top:4px">↻ Retry</button>'
  }
}

function renderTestCard(t) {
  const va = t.visitors_a || 0, vb = t.visitors_b || 0
  const ca = t.conversions_a || 0, cb = t.conversions_b || 0
  const totalV = va + vb, totalC = ca + cb
  const st = t.status || 'draft'
  const winner = t.winner && st === 'done' ? t.winner : ''

  const domain = (t.site_url || '').replace(/^https?:\/\//, '').replace(/\/+$/, '') || ''

  let signal = ''
  if (winner) {
    signal = '<span class="tc-stat win" title="Winner">' + IC_TROPHY + '<b>Variant ' + escapeHtml(winner) + '</b></span>'
  } else if (va > 0 && vb > 0) {
    const crA = ca / va, crB = cb / vb
    if (crA > 0) {
      const lift = Math.round(((crB - crA) / crA) * 100)
      const cls  = lift > 0 ? 'pos' : lift < 0 ? 'neg' : ''
      const sign = lift > 0 ? '+' : ''
      const ic   = lift < 0 ? IC_DOWN : IC_UP
      signal = '<span class="tc-stat ' + cls + '" title="Lift B vs A">' + ic + '<b>' + sign + lift + '%</b></span>'
    }
  }

  const statusLabel = st === 'active' ? 'Live' : st === 'paused' ? 'Paused' : st === 'done' ? 'Done' : 'Draft'
  const pauseIcon = st === 'paused'
    ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21"/></svg>'
    : '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>'

  var healthHtml = ''
  if (t.health_status === 'issues' && Array.isArray(t.health_issues) && t.health_issues.length) {
    var issueLabels = { missing_name:'No name', missing_site_url:'No website', missing_selector:'No element', missing_variant:'No variant', missing_goal:'No goal' }
    healthHtml = '<span class="badge bs-issues" title="' + t.health_issues.map(function(c){return issueLabels[c]||c}).join(', ') + '">' +
      t.health_issues.length + ' issue' + (t.health_issues.length !== 1 ? 's' : '') + '</span>'
  }

  const card = document.createElement('div')
  card.className = 'test-card st-' + st
  card.innerHTML =
    '<div class="tc-row1">' +
      '<span class="tc-name">' + escapeHtml(t.name) + '</span>' +
      '<span class="badge bs-' + st + '">' + statusLabel + '</span>' +
      healthHtml +
    '</div>' +
    (domain ? '<div class="tc-domain">' + escapeHtml(domain) + '</div>' : '') +
    '<div class="tc-row2">' +
      '<div class="tc-stats">' +
        '<span class="tc-stat" title="Visitors">' + IC_USER + '<b>' + fmtNum(totalV) + '</b></span>' +
        '<span class="tc-stat" title="Conversions">' + IC_CHECK + '<b>' + fmtNum(totalC) + '</b></span>' +
        signal +
      '</div>' +
      '<div class="tc-actions">' +
        '<button class="icon-btn" title="' + (st === 'paused' ? 'Resume' : 'Pause') + '" aria-label="' + (st === 'paused' ? 'Resume' : 'Pause') + '" onclick="event.stopPropagation();togglePause(\'' + t.id + '\',\'' + st + '\')">' + pauseIcon + '</button>' +
        '<button class="icon-btn danger" title="Delete" aria-label="Delete" onclick="event.stopPropagation();deleteTest(\'' + t.id + '\', this)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg></button>' +
      '</div>' +
    '</div>'
  card.onclick = () => resumeTest(t.id)
  card.tabIndex = 0
  card.setAttribute('role', 'button')
  card.setAttribute('aria-label', 'Open ' + (t.name || 'test'))
  card.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); resumeTest(t.id) } }
  return card
}
function fmtNum(n) { return (n || 0).toLocaleString('en-US') }

const IC_USER  = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>'
const IC_CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'

function resumeTest(id) {
  afetch(API + '/api/tests/' + id).then(function(r) {
    if (!r.ok) { window.open(API + '/results/' + id); return }
    return r.json().then(function(t) {
      if (t.health_status === 'issues' && Array.isArray(t.health_issues) && t.health_issues.length > 0) {
        // Fixing an incomplete test happens in the web dashboard, not in-plugin.
        parent.postMessage({ pluginMessage: { type: 'OPEN_URL', url: API + '/dashboard?highlight=' + encodeURIComponent(id) + '&source=figma-plugin' } }, '*')
      } else {
        window.open(API + '/results/' + id)
      }
    })
  }).catch(function() {
    window.open(API + '/results/' + id)
  })
}

async function togglePause(id, currentStatus) {
  const next = currentStatus === 'paused' ? 'active' : 'paused'
  try {
    const r = await afetch(API + '/api/tests/' + id, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: next })
    })
    if (!r.ok) {
      var eb = {}; try { eb = await r.json() } catch (_) {}
      throw new Error(apiErrorMessage(r.status, eb))
    }
    showDashboard()
  } catch (e) {
    err('dashboard', e.message)
  }
}
function showUndoToast(message, onUndo) {
  let t = $('toast')
  if (!t) {
    t = document.createElement('div')
    t.id = 'toast'
    t.className = 'toast'
    t.setAttribute('role', 'status')
    t.setAttribute('aria-live', 'polite')
    document.body.appendChild(t)
  }
  t.innerHTML = '<span>' + escapeHtml(message) + '</span><button class="link-btn" id="toast-action" style="padding:0">Undo</button>'
  t.classList.add('vis')
  $('toast-action').onclick = onUndo
}
function hideToast() {
  const t = $('toast'); if (t) t.classList.remove('vis')
}

function deleteTest(id, btn) {
  if (pendingDelete) commitPendingDelete()
  const card = btn.closest('.test-card')
  card.classList.add('deleting')
  card.setAttribute('aria-hidden', 'true')
  const timer = setTimeout(commitPendingDelete, 5000)
  pendingDelete = { id, card, timer }
  showUndoToast('Test deleted', undoDelete)
}
function undoDelete() {
  if (!pendingDelete) return
  clearTimeout(pendingDelete.timer)
  pendingDelete.card.classList.remove('deleting')
  pendingDelete.card.removeAttribute('aria-hidden')
  pendingDelete = null
  hideToast()
}
async function commitPendingDelete() {
  if (!pendingDelete) return
  const { id, card, timer } = pendingDelete
  clearTimeout(timer)
  pendingDelete = null
  hideToast()
  try {
    const res = await afetch(API + '/api/tests/' + id + '?confirm=true', { method: 'DELETE' })
    if (!res.ok) { var eb = {}; try { eb = await res.json() } catch (_) {} throw new Error(apiErrorMessage(res.status, eb)) }
    showDashboard()
  } catch (e) {
    if (card) { card.classList.remove('deleting'); card.removeAttribute('aria-hidden') }
    err('dashboard', 'Delete failed: ' + (e.message || e))
  }
}

window.onmessage = (event) => {
  const msg = event.data.pluginMessage
  if (!msg) return

  if (msg.type === 'TOKEN') {
    API_TOKEN = msg.token || ''
    if (API_TOKEN) {
      $('connect-token').value = API_TOKEN
      showDashboard()
    }
    return
  }
}
